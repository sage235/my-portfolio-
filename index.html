<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ASDODJI Le Sage — Le Village | Portfolio interactif</title>
<meta name="description" content="Portfolio RPG interactif d'ASDODJI Le Sage, étudiant en génie logiciel à l'AUCA (Rwanda). Parcourez le village, entrez dans chaque hutte et regardez le soleil se coucher.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<!-- Liaison vers le fichier CSS séparé -->
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="day">

<div id="sky" aria-hidden="true">
  <div class="sky-layer sky-day"></div>
  <div class="sky-layer sky-dusk"></div>
  <div class="sky-layer sky-night"></div>
  <div id="stars"></div>
  <div class="shoot"></div>
  <div class="sun"></div>
  <div class="moon"></div>
  <div class="cloud" style="top:34px;width:92px;animation-duration:95s;animation-delay:-20s"></div>
  <div class="cloud" style="top:78px;width:64px;animation-duration:130s;animation-delay:-70s"></div>
  <div class="cloud" style="top:52px;width:110px;animation-duration:160s;animation-delay:-120s"></div>
  <svg class="bird" style="top:60px;animation-duration:38s;animation-delay:-6s" viewBox="0 0 22 10"><path d="M1,8 Q6,0 11,6 Q16,0 21,8" fill="none" stroke="#3a2d26" stroke-width="1.6" stroke-linecap="round"/></svg>
  <svg class="bird" style="top:90px;animation-duration:52s;animation-delay:-30s" viewBox="0 0 22 10"><path d="M1,8 Q6,0 11,6 Q16,0 21,8" fill="none" stroke="#3a2d26" stroke-width="1.6" stroke-linecap="round"/></svg>
  <svg class="hills" viewBox="0 0 1200 60" preserveAspectRatio="none">
    <path d="M0,34 Q150,6 320,30 T640,24 T960,32 T1200,18 L1200,60 L0,60Z" fill="#7da35c"/>
    <path d="M0,46 Q220,22 420,44 T820,40 T1200,36 L1200,60 L0,60Z" fill="#5f8a45"/>
  </svg>
</div>

<header class="hud">
  <div class="who">
    <img class="avatar" src="photo.jpg" alt="ASDODJI Le Sage"
         onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'avatar fallback',textContent:'LS'}))">
    <div>
      <b>ASDODJI Le Sage</b>
      <small data-i18n="tagline">Software engineer · AUCA, Rwanda</small>
    </div>
  </div>

  <ul class="fast" id="fast" aria-label="Fast travel"></ul>

  <div class="tools">
    <span class="chip" id="progress">Explored 0/7</span>
    <!-- Bouton direct pour le mode CV classique -->
    <button class="ibtn" id="cvModeBtn" aria-label="Mode CV Classique" title="Mode CV Classique" style="font-size:.65rem;font-weight:700;">CV</button>
    <a class="ibtn links" href="https://www.linkedin.com/in/le-sage-asdodji/" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn">in</a>
    <a class="ibtn links" href="https://github.com/sage235" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .97-.31 3.16 1.18a10.9 10.9 0 0 1 5.76 0c2.19-1.49 3.15-1.18 3.15-1.18.63 1.58.24 2.75.12 3.04.74.8 1.18 1.83 1.18 3.08 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>
    </a>
    <button class="ibtn" id="soundBtn" aria-pressed="false" aria-label="Music" title="Music">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path class="waves" d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
    </button>
    <button class="ibtn" id="themeBtn" aria-label="Day / night" title="Day / night">
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M1.5 12H4M20 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    </button>
    <button class="ibtn" id="langBtn" aria-label="Change language" title="FR / EN">FR</button>
  </div>
</header>

<main id="viewport" aria-label="Interactive village">
  <div id="world">
    <svg id="ground"></svg>
    <div id="objects"></div>
  </div>
  <canvas id="night"></canvas>
</main>

<div class="hint" id="hint">
  <span data-i18n="hint_walk">Walk</span> <kbd>🕹️</kbd> <kbd>←↑→↓</kbd> <kbd>WASD</kbd>
  <span>·</span> <span data-i18n="hint_enter">Enter a door</span> <kbd>E</kbd>
  <span>·</span> <span data-i18n="hint_ride">Ride</span> <kbd>F</kbd>
  <span>·</span> <span data-i18n="hint_sprint">Sprint</span> <kbd>Shift</kbd>
</div>

<div class="joystick" id="joystick">
  <div class="joy-base" id="joyBase">
    <div class="joy-knob" id="joyKnob"></div>
  </div>
  <div class="joy-actions">
    <button id="actBtn" class="joy-btn go">GO</button>
    <button id="rideBtn" class="joy-btn ride">RIDE</button>
    <button id="runBtn" class="joy-btn run">RUN</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="overlay open" id="intro" role="dialog" aria-modal="true" aria-labelledby="introTitle">
  <div class="sheet small">
    <div class="kicker" data-i18n="intro_kicker">Portfolio of ASDODJI Le Sage</div>
    <h2 id="introTitle" data-i18n="intro_title">Welcome to my village.</h2>
    <p data-i18n="intro_p1">Each hut holds a piece of my story...</p>
    <p data-i18n="intro_p2">Walk with the joystick or arrow keys...</p>
    <div class="actions">
      <button class="btn" id="startBtn" data-i18n="start">Start walking</button>
      <!-- Option directe pour ouvrir le CV classique dès l'accueil -->
      <button class="btn alt" id="introCvBtn">📄 Voir le CV classique</button>
    </div>
  </div>
</div>

<div class="overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="sheet">
    <button class="x" id="closeBtn" aria-label="Close">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<!-- Liaison vers le fichier JavaScript séparé -->
<script src="script.js"></script>
</body>
</html>
